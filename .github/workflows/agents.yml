name: agents

on:
  schedule:
    # Every 30 min during US market hours (UTC). agents.py decides whether it's
    # pick time, grading time or scoreboard time, so extra runs are harmless.
  - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Test run: make calls now, post them as TEST, record nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent desk
        env:
          AGENTS_WEBHOOK_URL: ${{ secrets.AGENTS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          FORCE_PICKS: ${{ inputs.test && '1' || '' }}
        run: python agents.py

      - name: Commit results
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add agent_calls.csv 2>/dev/null || true
          git add agent_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "agents: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
