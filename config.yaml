# ---------------------------------------------------------------------------
# Watcher config. Edit, commit, and the next run picks it up.
# No API keys in here - those live in GitHub repository secrets.
# ---------------------------------------------------------------------------

alert_cooldown_minutes: 240
wallet_tx_limit: 25


# ---------------------------------------------------------------------------
# Price rules
#
# Thresholds are set per-name by how much each one normally moves. A uniform
# threshold would drown you in small-cap noise while missing real moves in the
# large caps. Tune these after a week of watching - if a name alerts every day,
# raise it; if it never alerts, lower it.
# ---------------------------------------------------------------------------

tickers:

  # --- Large cap: a 3% day here is a real event -------------------------------

  - symbol: GOOGL          # Alphabet Class A
    kind: equity
    rules:
      - type: pct_move
        threshold: 3.0

  # --- Mid cap / high beta ----------------------------------------------------

  - symbol: HOOD           # Robinhood Markets
    kind: equity
    rules:
      - type: pct_move
        threshold: 4.0

  - symbol: MRNA           # Moderna
    kind: equity
    rules:
      - type: pct_move
        threshold: 5.0

  - symbol: NBIS           # Nebius Group
    kind: equity
    rules:
      - type: pct_move
        threshold: 6.0

  # --- Rare earth theme -------------------------------------------------------
  # REMX is the sector ETF, USAR a single name inside that theme. They will
  # often alert together - that is the theme moving, not two signals.

  - symbol: REMX           # VanEck Rare Earth & Strategic Metals ETF
    kind: equity
    rules:
      - type: pct_move
        threshold: 4.0

  - symbol: USAR           # USA Rare Earth
    kind: equity
    rules:
      - type: pct_move
        threshold: 7.0

  # --- Speculative ------------------------------------------------------------

  - symbol: INFQ           # Infleqtion
    kind: equity
    rules:
      - type: pct_move
        threshold: 8.0

  # --- Market context ---------------------------------------------------------
  # Keep SPY so you can tell "my stock moved" from "everything moved".

  - symbol: SPY
    kind: equity
    rules:
      - type: pct_move
        threshold: 1.5

  - symbol: BTC
    kind: crypto
    coingecko_id: bitcoin
    rules:
      - type: pct_move
        threshold: 4.0
        cooldown_minutes: 360


# ---------------------------------------------------------------------------
# Wallets - unused for now.
# ---------------------------------------------------------------------------

wallets:
  solana: []
  evm: []
